<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhereToNext - Screenshots</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <button class="mobile-nav-toggle" aria-label="Toggle navigation">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
    </button>
    <div class="mobile-overlay"></div>
    <aside class="sidebar">
        <span class="sidebar-title">NAVIGATION</span>
        <ul>
            <li><a href="index.html">Overview</a></li>
            <li class="active"><a href="screenshots.html">Screenshots</a></li>
            <li><a href="changelog.html">Changelog</a></li>
            <li><a href="faq.html">FAQ</a></li>
            <li><a href="guide.html">User Guide</a></li>
            <li><a href="pricing.html">Pricing</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="header-block">
            <h1>Screenshots</h1>
            <span style="color: #666;">Visuals</span>
        </div>

        <div class="section-block">
            <span class="section-title">App Interface</span>
            <div class="screenshot-list">
                <div class="screenshot-item">
                    <h3 class="screenshot-title">Dashboard</h3>
                    <img src="images/dashboard.png" alt="Dashboard">
                </div>
                <div class="screenshot-item">
                    <h3 class="screenshot-title">Job Board</h3>
                    <img src="images/jobboard.png" alt="Job Board">
                </div>
                <div class="screenshot-item">
                    <h3 class="screenshot-title">Marketplace</h3>
                    <img src="images/marketplace.png" alt="Marketplace">
                </div>
                <div class="screenshot-item">
                    <h3 class="screenshot-title">Current Job In Progress</h3>
                    <img src="images/currentjob_inprogress.png" alt="Current Job In Progress">
                </div>
            </div>
            <p style="margin-top:20px; font-size:0.8em;">* Images captured in MSFS 2024</p>
        </div>
    </main>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
        <div id="caption"></div>
    </div>

    <script>
        // Get the modal
        var modal = document.getElementById("lightbox");
        var modalImg = document.getElementById("lightbox-img");
        var captionText = document.getElementById("caption");

        // Get all images in the screenshot list
        var images = document.querySelectorAll('.screenshot-item img');

        // Loop through them and add click event
        images.forEach(function (img) {
            img.onclick = function () {
                modal.style.display = "block";
                modalImg.src = this.src;
                // Use the title from the h3 sibling if available, or alt text
                var title = this.previousElementSibling ? this.previousElementSibling.innerText : this.alt;
                captionText.innerHTML = title;
            }
        });

        // Get the <span> element that closes the modal
        var span = document.getElementsByClassName("close")[0];

        // When the user clicks on <span> (x), close the modal
        span.onclick = function () {
            modal.style.display = "none";
        }

        // Also close if clicking outside the image
        modal.onclick = function (event) {
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }

        // Mobile navigation toggle
        const toggle = document.querySelector('.mobile-nav-toggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.mobile-overlay');

        function toggleMenu() {
            toggle.classList.toggle('active');
            sidebar.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        toggle.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);
    </script>
</body>

</html>
